; Az official image zz-docker.conf fájlját felülírja (a "zzz" név miatt utoljára töltődik be).
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; A konténer környezeti változóit a PHP-nek is látnia kell.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
